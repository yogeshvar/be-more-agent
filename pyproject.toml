[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beemboy"
version = "0.1.0"
description = "Local assistant: llama-server + MCP (Brave Search) agent loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.55.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "mcp>=1.12.0",
  "structlog>=24.4.0",
  "typer>=0.12.0",
]

[project.scripts]
beemboy = "beemboy.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
