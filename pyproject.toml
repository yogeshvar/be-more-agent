[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beemboy-offline-assistant"
version = "0.1.0"
description = "Fully offline Mac voice-first assistant with local llama.cpp"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "mags" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
beemboy = "beemboy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
